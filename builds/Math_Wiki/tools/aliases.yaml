# -----------------------------------------------------------------------------
# MERGES --- cross-branch duplicates the conservative consolidator missed.
# Pre-calc (Stitz-Zeager) and algebra-2 both cover several topics; where the
# content clearly overlaps, we fold them into a single canonical topic with
# multiple sources.
# -----------------------------------------------------------------------------
merges:
  - from: ["Polydivision", "Polynomial_Division"]
    into: "Polynomial_Division"
    canonical_title: "Polynomial Division"
    rationale: "Stitz-Zeager 'Polydivision' and algebra-2 'Polynomial_Division' cover the same dividing-polynomial material; merge into the more descriptive slug."

  - from: ["Rationalineq", "Rational_Inequalities"]
    into: "Rational_Inequalities"
    canonical_title: "Rational Inequalities"
    rationale: "Stitz-Zeager abbreviation collides with algebra-2's full name; merge."

  - from: ["Expequations", "Exponential_Equations"]
    into: "Exponential_Equations"
    canonical_title: "Exponential Equations"
    rationale: "Stitz-Zeager 'ExpEquations' and algebra-2 'Exponential_Equations' are the same topic; merge."

  - from: ["Logequations", "Logarithmic_Equations"]
    into: "Logarithmic_Equations"
    canonical_title: "Logarithmic Equations"
    rationale: "Stitz-Zeager 'LogEquations' and algebra-2 'Logarithmic_Equations' are the same topic; merge."

  - from: ["Linsystems", "Systems_Of_Linear_Equations"]
    into: "Systems_Of_Linear_Equations"
    canonical_title: "Systems of Linear Equations"
    rationale: "Stitz-Zeager 'LinSystems' chapter overlaps substantially with algebra-2's systems chapter; merge."

  - from: ["Functioncomposition", "Functionarithmetic", "Function_Arithmetic_And_Composition"]
    into: "Function_Arithmetic_And_Composition"
    canonical_title: "Function Arithmetic and Composition"
    rationale: "Stitz-Zeager separates function composition and function arithmetic into two sections; algebra-2 covers both in one chapter. Merge all three into the combined algebra-2 slug."

  - from: ["Quadraticfunctions", "Quadratic_Functions_And_Vertex_Form"]

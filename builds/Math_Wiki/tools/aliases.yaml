    branch: "algebra-2"
    canonical_title: "Quadratic Functions"
    rationale: "Stitz-Zeager 'QuadraticFunctions' is the general chapter; algebra-2 'Quadratic_Functions_And_Vertex_Form' is a subset. Merge into a cleaner canonical slug; pin to algebra-2 branch so it appears in that hub."


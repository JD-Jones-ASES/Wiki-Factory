# Math_Wiki canonical-topic alias rules.
#
# This file is a LIVING RECORD of manual merge decisions the conservative
# exact-title consolidator in tools/consolidate_extractions.py can't make on
# its own. It is applied in consolidate_extractions.py AFTER titles are
# normalized and topics are keyed by normalized-title, but BEFORE the catalog
# shards are written.
#
# Location: builds/Math_Wiki/tools/aliases.yaml (version-controlled). The
# raw/ tree is gitignored, so this file lives alongside the consolidation
# tool it configures rather than inside raw/catalog/.
#
# WORKFLOW
# --------
# 1. Run consolidate_extractions.py with no aliases active (or with any
#    existing ones) to produce a catalog.
# 2. Review the catalog and spot topics that should be merged, renamed, or
#    split. Edit this file.
# 3. Rerun consolidate_extractions.py. Your rules apply; the affected slugs
#    and canonical titles change in a single pass.
# 4. Rerun tools/generate_topic_stubs.py --branch all --force (scoped to the
#    affected slugs) to regenerate any wiki pages that changed slugs.
# 5. Commit the updated aliases.yaml, the regenerated catalog, and any
#    regenerated stubs together.
#
# ORDER OF OPERATIONS (inside apply_aliases)
#   1. RENAMES are applied first (so downstream merges/splits can refer to
#      either the old or the new slug).
#   2. MERGES are applied next (after renames, so merge rules can refer to
#      renamed slugs).
#   3. SPLITS are applied last (a split on a merged target is well-defined).
#
# SLUG CONVENTIONS
# ----------------
# Slugs are Title_Case_With_Underscores (e.g., "Polynomial_Division"), matching
# the filenames in wiki/topics/. Slugs are case-sensitive.
#
# SCHEMA VERSION 1
# ----------------
# merges:
#   - from: ["Slug_A", "Slug_B", ...]   # two or more slugs to collapse
#     into: "Canonical_Slug"            # target slug (may or may not appear in 'from')
#     canonical_title: "Human Title"    # optional; defaults to the 'into' slug with underscores->spaces
#     rationale: "Short reason"         # required; documents the merge decision
#
# renames:
#   - from: "Old_Slug"
#     to: "New_Slug"
#     canonical_title: "Human Title"    # optional
#     rationale: "Short reason"
#
# splits:
#   - from: "Overloaded_Slug"
#     into:
#       - slug: "Child_A"
#         canonical_title: "Child A"
#         keep_sources_matching:        # which sources move to this child
#           - book_slug: "algtrig"
#             section_prefix: "1.1"
#       - slug: "Child_B"
#         canonical_title: "Child B"
#         keep_sources_matching:
#           - book_slug: "algebra_2"
#     rationale: "Short reason"
#
# NOTES
# -----
# - An empty merges/renames/splits list (or omitting the key entirely) is
#   valid. A fresh file just has `version: 1` and nothing else.
# - Destructive operations (delete slug, remove from catalog) are NOT
#   supported. Use a merge into the intended canonical slug instead.
# - A slug appearing in multiple destination rules is an error; apply_aliases
#   will raise.
# - Live wiki pages whose slug gets renamed will need their files moved on
#   disk; that move is NOT done by consolidate_extractions.py. Use
#   `py -3 tools/generate_topic_stubs.py --force` to regenerate stubs at the
#   new slug. Hand-written topic pages (Circles, etc.) need manual `git mv`.
#
# -----------------------------------------------------------------------------

version: 1


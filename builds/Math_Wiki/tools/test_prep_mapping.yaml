# test_prep_mapping.yaml
# Maps topic_slug (lowercase filename stem) -> list of test tags the topic appears on.
#
# Keys must match actual files in wiki/topics/**/*.md (lowercased stem). Values
# are any subset of [test-sat, test-psat, test-act, test-clt] (tag taxonomy Section 7).
#
# This file is hand-curated from standardized test coverage research. To propagate
# changes to topic frontmatter, run:
#   py -3 tools/apply_test_tags.py --dry-run     # preview
#   py -3 tools/apply_test_tags.py               # apply (idempotent)
#
# Rules of thumb that drove the initial mapping:
#   - Core pre-algebra arithmetic (integers, fractions, decimals, percents, basic
#     geometry, basic stats): all 4 tags. CLT is heavy on arithmetic fluency.
#   - Algebra 1 foundations (linear equations, systems, functions): SAT + PSAT + ACT;
#     add CLT where the flavor is computational rather than advanced.
#   - Algebra 2 / advanced (quadratic methods, functions, log/exp): SAT + PSAT + ACT,
#     no CLT (CLT's quantitative section caps around Algebra 1 level).
#   - Advanced trig identities, conic sections, matrices, binomial distribution,
#     permutations/combinations, normal distribution: ACT only.
#   - Coordinate geometry and probability basics: usually 3-4 tags.
#
# Leave a topic out of this file if it is out of scope for all four tests
# (e.g., mathematical induction is a niche topic not on any standardized test).

